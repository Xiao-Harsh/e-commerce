<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <!-- Sleek dark squircle badge for crisp contrast in both light and dark browser tabs -->
  <rect width="64" height="64" rx="16" fill="#09090b"/>
  
  <!-- Sneaker Silhouette Group -->
  <g transform="translate(2, 2)">
    <!-- Sole / Cushion unit -->
    <path d="M10 43c2 0 6 1 12 1 11 0 21-1 28-3.5 1.5 1.5.5 4.5-3 5-9 1-25 1-35 0-3-.3-4-2-2-2.5z" fill="#ffffff"/>
    
    <!-- Sneaker Upper Outline & Body -->
    <path d="M10 41c0-4 1-13 4-15 2-1.5 5-.5 7-3.5 1.5-2.5 3-5.5 6-6 3-.5 6 1 7 4l4 4.5c3 2.5 6 4 9 7 2 2 3 5 3 7.5-6 1.8-18 2.5-40 1.5z" 
          fill="#18181b" 
          stroke="#ffffff" 
          stroke-width="2.5" 
          stroke-linejoin="round"/>
    
    <!-- Dynamic Soltrix Athletic Swoop / Accent -->
    <path d="M15 36c7 1 17-2.5 28-1" stroke="#ea580c" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Lacing Eyelet Details -->
    <line x1="25" y1="23" x2="29" y2="24" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <line x1="27" y1="27" x2="31" y2="28" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <line x1="30" y1="31" x2="34" y2="32" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>